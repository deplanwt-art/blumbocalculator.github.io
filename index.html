<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Супер Калькулятор</title>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        user-select: none;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background: linear-gradient(145deg, #1a1c25 0%, #0f1014 100%);
        overflow: hidden;
        padding: 16px;
    }

    /* --- СВЕТЯЩИЙСЯ ФОН --- */
    .glow-bg {
        position: fixed;
        inset: 0;
        z-index: 0;
        overflow: hidden;
        pointer-events: none;
    }

    .glow-bg::before,
    .glow-bg::after {
        content: '';
        position: absolute;
        border-radius: 50%;
        filter: blur(100px);
        opacity: 0.6;
        animation: float 12s infinite alternate ease-in-out;
        transition: opacity 0.6s ease, filter 0.6s ease, background 0.6s ease;
    }

    .glow-bg::before {
        width: 500px; height: 500px;
        background: #6a5acd;
        top: -150px; left: -100px;
    }

    .glow-bg::after {
        width: 400px; height: 400px;
        background: #ff6b9d;
        bottom: -100px; right: -100px;
        animation-delay: -4s;
        animation-duration: 15s;
    }

    body.solving .glow-bg::before { opacity: 1; filter: blur(70px); background: #8b7cf7; }
    body.solving .glow-bg::after { opacity: 1; filter: blur(70px); background: #ff8fb8; }
    body.scientific .glow-bg::before { background: #00d4ff; }
    body.scientific .glow-bg::after { background: #7b2ff7; }

    @keyframes float {
        0% { transform: translate(0, 0) scale(1); }
        100% { transform: translate(80px, 60px) scale(1.2); }
    }

    /* --- КОНТЕЙНЕР --- */
    .calculator {
        position: relative;
        z-index: 1;
        width: 100%;
        max-width: 420px;
        background: rgba(25, 27, 35, 0.78);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        border-radius: 44px;
        padding: 20px 18px 26px;
        box-shadow:
            0 30px 60px rgba(0, 0, 0, 0.6),
            inset 0 1px 2px rgba(255, 255, 255, 0.08),
            0 0 0 1px rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 255, 255, 0.06);
        transition: transform 0.3s ease, box-shadow 0.5s ease, max-width 0.5s ease;
    }

    .calculator:hover { transform: translateY(-4px); }
    body.scientific .calculator { max-width: 460px; }

    body.solving .calculator {
        box-shadow:
            0 30px 60px rgba(0, 0, 0, 0.6),
            0 0 80px rgba(139, 124, 247, 0.35),
            inset 0 1px 2px rgba(255, 255, 255, 0.12),
            0 0 0 1px rgba(139, 124, 247, 0.25);
    }

    body.scientific.solving .calculator {
        box-shadow:
            0 30px 60px rgba(0, 0, 0, 0.6),
            0 0 80px rgba(0, 212, 255, 0.4),
            inset 0 1px 2px rgba(255, 255, 255, 0.12),
            0 0 0 1px rgba(0, 212, 255, 0.25);
    }

    /* --- ВЕРХНЯЯ ПАНЕЛЬ --- */
    .top-bar {
        display: flex;
        gap: 10px;
        align-items: stretch;
        margin-bottom: 14px;
    }

    .mode-switch {
        flex: 1;
        display: flex;
        background: rgba(0, 0, 0, 0.35);
        border-radius: 20px;
        padding: 4px;
        position: relative;
        box-shadow:
            inset 0 2px 6px rgba(0, 0, 0, 0.4),
            0 1px 0 rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.04);
    }

    .mode-switch::before {
        content: '';
        position: absolute;
        top: 4px; left: 4px;
        width: calc(50% - 4px);
        height: calc(100% - 8px);
        background: linear-gradient(135deg, #6a5acd, #8b7cf7);
        border-radius: 16px;
        transition: transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1),
                    background 0.4s ease;
        box-shadow:
            0 4px 12px rgba(106, 90, 205, 0.5),
            inset 0 1px 0 rgba(255, 255, 255, 0.2);
        z-index: 0;
    }

    body.scientific .mode-switch::before {
        transform: translateX(100%);
        background: linear-gradient(135deg, #00d4ff, #7b2ff7);
        box-shadow:
            0 4px 12px rgba(0, 212, 255, 0.5),
            inset 0 1px 0 rgba(255, 255, 255, 0.25);
    }

    .mode-btn {
        flex: 1;
        border: none;
        outline: none;
        background: transparent;
        color: rgba(255, 255, 255, 0.5);
        font-size: 12px;
        font-weight: 600;
        padding: 9px 0;
        border-radius: 16px;
        cursor: pointer;
        position: relative;
        z-index: 1;
        transition: color 0.3s ease;
        letter-spacing: 0.3px;
        text-transform: uppercase;
        -webkit-tap-highlight-color: transparent;
    }

    .mode-btn.active { color: #fff; }
    .mode-btn:not(.active):hover { color: rgba(255, 255, 255, 0.8); }

    /* Кнопка языка */
    .lang-switch {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 5px;
        background: rgba(0, 0, 0, 0.35);
        border-radius: 20px;
        padding: 4px 12px;
        cursor: pointer;
        border: 1px solid rgba(255, 255, 255, 0.04);
        box-shadow:
            inset 0 2px 6px rgba(0, 0, 0, 0.4),
            0 1px 0 rgba(255, 255, 255, 0.04);
        transition: background 0.3s ease, transform 0.2s ease;
        -webkit-tap-highlight-color: transparent;
        min-width: 72px;
        position: relative;
        z-index: 100;
        pointer-events: auto;
        font-family: inherit;
        color: #fff;
    }

    .lang-switch:hover { background: rgba(255, 255, 255, 0.06); }
    .lang-switch:active { transform: scale(0.95); }

    .lang-switch .lang-flag,
    .lang-switch .lang-code {
        pointer-events: none;
    }

    .lang-flag {
        font-size: 18px;
        line-height: 1;
        display: inline-block;
    }

    .lang-switch.switching .lang-flag {
        animation: flagFlip 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes flagFlip {
        0% { transform: rotateY(0deg) scale(1); }
        50% { transform: rotateY(90deg) scale(0.7); }
        100% { transform: rotateY(0deg) scale(1); }
    }

    .lang-code {
        font-size: 11px;
        font-weight: 700;
        color: rgba(255, 255, 255, 0.85);
        letter-spacing: 0.8px;
    }

    /* --- ДИСПЛЕЙ --- */
    .display {
        background: rgba(0, 0, 0, 0.35);
        border-radius: 28px;
        padding: 20px 20px 14px;
        margin-bottom: 14px;
        box-shadow:
            inset 0 4px 12px rgba(0, 0, 0, 0.5),
            0 1px 0 rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.04);
        min-height: 110px;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        align-items: flex-end;
        word-break: break-all;
        transition: box-shadow 0.3s ease, border-color 0.3s ease;
        overflow: hidden;
        position: relative;
    }

    .display.flash { animation: displayFlash 0.7s cubic-bezier(0.25, 0.46, 0.45, 0.94); }
    body.scientific .display.flash { animation: displayFlashSci 0.7s cubic-bezier(0.25, 0.46, 0.45, 0.94); }

    @keyframes displayFlash {
        0% { box-shadow: inset 0 4px 12px rgba(0,0,0,0.5), 0 0 0 0 rgba(139,124,247,0); border-color: rgba(255,255,255,0.04); }
        30% { box-shadow: inset 0 4px 20px rgba(139,124,247,0.3), 0 0 30px 4px rgba(139,124,247,0.4); border-color: rgba(139,124,247,0.6); }
        100% { box-shadow: inset 0 4px 12px rgba(0,0,0,0.5), 0 0 0 0 rgba(139,124,247,0); border-color: rgba(255,255,255,0.04); }
    }

    @keyframes displayFlashSci {
        0% { box-shadow: inset 0 4px 12px rgba(0,0,0,0.5), 0 0 0 0 rgba(0,212,255,0); border-color: rgba(255,255,255,0.04); }
        30% { box-shadow: inset 0 4px 20px rgba(0,212,255,0.3), 0 0 30px 4px rgba(0,212,255,0.45); border-color: rgba(0,212,255,0.6); }
        100% { box-shadow: inset 0 4px 12px rgba(0,0,0,0.5), 0 0 0 0 rgba(0,212,255,0); border-color: rgba(255,255,255,0.04); }
    }

    .display.pulse { animation: displayPulse 0.5s ease; }

    @keyframes displayPulse {
        0% { transform: scale(1); }
        50% { transform: scale(1.03); }
        100% { transform: scale(1); }
    }

    .history {
        font-size: 14px;
        color: rgba(255, 255, 255, 0.4);
        min-height: 20px;
        margin-bottom: 4px;
    }

    .history.slide-up { animation: historySlideUp 0.4s ease forwards; }

    @keyframes historySlideUp {
        0% { opacity: 1; transform: translateY(0); }
        100% { opacity: 0; transform: translateY(-20px); }
    }

    .current {
        font-size: 40px;
        font-weight: 600;
        color: #ffffff;
        line-height: 1.1;
        letter-spacing: -1px;
        text-shadow: 0 2px 10px rgba(255, 255, 255, 0.15);
        transition: all 0.2s ease;
        max-width: 100%;
        transform-origin: right center;
    }

    .current.small { font-size: 26px; }
    .current.result-appear { animation: resultAppear 0.55s cubic-bezier(0.34, 1.56, 0.64, 1); }
    body.scientific .current.result-appear { animation: resultAppearSci 0.55s cubic-bezier(0.34, 1.56, 0.64, 1); }

    @keyframes resultAppear {
        0% { opacity: 0; transform: translateY(30px) scale(0.85); color: #8b7cf7; text-shadow: 0 0 20px rgba(139,124,247,0.8); }
        60% { opacity: 1; transform: translateY(-6px) scale(1.05); color: #b8aaff; text-shadow: 0 0 30px rgba(139,124,247,1); }
        100% { opacity: 1; transform: translateY(0) scale(1); color: #ffffff; text-shadow: 0 2px 10px rgba(255,255,255,0.15); }
    }

    @keyframes resultAppearSci {
        0% { opacity: 0; transform: translateY(30px) scale(0.85); color: #00d4ff; text-shadow: 0 0 20px rgba(0,212,255,0.8); }
        60% { opacity: 1; transform: translateY(-6px) scale(1.05); color: #7be0ff; text-shadow: 0 0 30px rgba(0,212,255,1); }
        100% { opacity: 1; transform: translateY(0) scale(1); color: #ffffff; text-shadow: 0 2px 10px rgba(255,255,255,0.15); }
    }

    .current.digit-pop { animation: digitPop 0.25s ease; }

    @keyframes digitPop {
        0% { transform: scale(1); }
        50% { transform: scale(1.08); }
        100% { transform: scale(1); }
    }

    /* --- ПАНЕЛИ --- */
    .panels { display: grid; }

    .panel {
        grid-area: 1 / 1;
        display: grid;
        gap: 10px;
        transition: opacity 0.4s ease, transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .panel.basic {
        grid-template-columns: repeat(4, 1fr);
        opacity: 1;
        transform: translateX(0) scale(1);
    }

    .panel.scientific {
        grid-template-columns: repeat(5, 1fr);
        opacity: 0;
        transform: translateX(40px) scale(0.95);
        pointer-events: none;
        visibility: hidden;
    }

    body.scientific .panel.basic {
        opacity: 0;
        transform: translateX(-40px) scale(0.95);
        pointer-events: none;
        visibility: hidden;
    }

    body.scientific .panel.scientific {
        opacity: 1;
        transform: translateX(0) scale(1);
        pointer-events: auto;
        visibility: visible;
    }

    /* --- КНОПКИ --- */
    .btn {
        border: none;
        outline: none;
        background: rgba(255, 255, 255, 0.06);
        color: #ffffff;
        font-size: 20px;
        font-weight: 500;
        padding: 15px 0;
        border-radius: 20px;
        cursor: pointer;
        transition: all 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        box-shadow:
            0 4px 8px rgba(0, 0, 0, 0.3),
            inset 0 1px 0 rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.04);
        display: flex;
        align-items: center;
        justify-content: center;
        line-height: 1;
        position: relative;
        overflow: hidden;
        -webkit-tap-highlight-color: transparent;
        min-height: 52px;
        font-family: inherit;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(255, 255, 255, 0.12);
        transition: all 0.05s ease;
    }

    .btn.operator {
        background: rgba(106, 90, 205, 0.25);
        color: #b8aaff;
        border-color: rgba(106, 90, 205, 0.3);
        font-weight: 600;
    }
    .btn.operator:active { background: rgba(106, 90, 205, 0.45); }

    body.scientific .btn.operator {
        background: rgba(0, 212, 255, 0.18);
        color: #7be0ff;
        border-color: rgba(0, 212, 255, 0.25);
    }
    body.scientific .btn.operator:active { background: rgba(0, 212, 255, 0.35); }

    .btn.equal {
        background: linear-gradient(135deg, #6a5acd, #8b7cf7);
        color: #fff;
        font-weight: 700;
        box-shadow:
            0 8px 20px rgba(106, 90, 205, 0.4),
            inset 0 1px 0 rgba(255, 255, 255, 0.2);
        border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .btn.equal:active {
        transform: scale(0.94);
        box-shadow: 0 4px 10px rgba(106, 90, 205, 0.5);
    }

    body.scientific .btn.equal {
        background: linear-gradient(135deg, #00a8e0, #7b2ff7);
        box-shadow: 0 8px 20px rgba(0, 212, 255, 0.4);
    }

    .btn.equal.ripple::before {
        content: '';
        position: absolute;
        top: 50%; left: 50%;
        width: 10px; height: 10px;
        background: rgba(255, 255, 255, 0.6);
        border-radius: 50%;
        transform: translate(-50%, -50%) scale(0);
        animation: rippleWave 0.7s ease-out;
        pointer-events: none;
    }

    @keyframes rippleWave {
        0% { transform: translate(-50%, -50%) scale(0); opacity: 0.8; }
        100% { transform: translate(-50%, -50%) scale(35); opacity: 0; }
    }

    .btn.equal.solving { animation: equalGlow 0.7s ease; }

    @keyframes equalGlow {
        0% { box-shadow: 0 8px 20px rgba(106, 90, 205, 0.4); }
        40% {
            box-shadow: 0 8px 30px rgba(139, 124, 247, 0.9), 0 0 40px rgba(139, 124, 247, 0.7);
            transform: scale(1.06);
        }
        100% { box-shadow: 0 8px 20px rgba(106, 90, 205, 0.4); transform: scale(1); }
    }

    .btn.clear {
        color: #ff6b9d;
        background: rgba(255, 107, 157, 0.12);
        border-color: rgba(255, 107, 157, 0.15);
        font-weight: 600;
    }
    .btn.clear:active { background: rgba(255, 107, 157, 0.25); }

    .btn.delete {
        color: #ffb86b;
        background: rgba(255, 184, 107, 0.1);
        border-color: rgba(255, 184, 107, 0.12);
        font-size: 18px;
    }
    .btn.delete:active { background: rgba(255, 184, 107, 0.25); }

    .btn.func {
        font-size: 14px;
        font-weight: 600;
        padding: 13px 0;
        background: rgba(0, 212, 255, 0.08);
        color: #7be0ff;
        border-color: rgba(0, 212, 255, 0.15);
        border-radius: 16px;
        min-height: 48px;
    }
    .btn.func:active { background: rgba(0, 212, 255, 0.28); }

    .btn.mem {
        font-size: 13px;
        font-weight: 600;
        padding: 13px 0;
        background: rgba(255, 184, 107, 0.1);
        color: #ffb86b;
        border-color: rgba(255, 184, 107, 0.15);
        border-radius: 16px;
        min-height: 48px;
    }
    .btn.mem:active { background: rgba(255, 184, 107, 0.3); }

    .mem-indicator {
        position: absolute;
        top: 12px; left: 20px;
        font-size: 11px;
        font-weight: 700;
        color: #ffb86b;
        background: rgba(255, 184, 107, 0.15);
        padding: 3px 8px;
        border-radius: 8px;
        opacity: 0;
        transform: scale(0.8);
        transition: opacity 0.3s ease, transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        pointer-events: none;
    }

    .mem-indicator.active { opacity: 1; transform: scale(1); }

    .btn.span-2 { grid-column: span 2; }

    /* Тост */
    .lang-toast {
        position: fixed;
        top: 20px; left: 50%;
        transform: translateX(-50%) translateY(-80px);
        background: rgba(25, 27, 35, 0.95);
        backdrop-filter: blur(20px);
        color: #fff;
        padding: 10px 20px;
        border-radius: 16px;
        font-size: 14px;
        font-weight: 600;
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 30px rgba(139, 124, 247, 0.3);
        z-index: 1000;
        opacity: 0;
        transition: opacity 0.3s ease, transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        pointer-events: none;
    }

    .lang-toast.show {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
    }

    /* --- АДАПТИВНОСТЬ --- */
    @media (max-width: 460px) {
        .calculator {
            padding: 16px 12px 20px;
            border-radius: 34px;
            max-width: 100%;
        }
        body.scientific .calculator { max-width: 100%; }
        .top-bar { gap: 8px; margin-bottom: 12px; }
        .mode-btn { font-size: 10px; padding: 8px 0; }
        .lang-switch { padding: 3px 10px; min-width: 64px; }
        .lang-flag { font-size: 16px; }
        .lang-code { font-size: 10px; }
        .display { padding: 16px 16px 12px; min-height: 100px; border-radius: 22px; }
        .current { font-size: 32px; }
        .current.small { font-size: 20px; }
        .panel { gap: 7px; }
        .btn { font-size: 16px; padding: 11px 0; border-radius: 14px; min-height: 44px; }
        .btn.func, .btn.mem { font-size: 11px; padding: 9px 0; min-height: 40px; }
    }

    @media (max-width: 360px) {
        .btn { font-size: 14px; padding: 9px 0; min-height: 38px; }
        .btn.func, .btn.mem { font-size: 10px; padding: 7px 0; min-height: 34px; }
        .current { font-size: 26px; }
        .panel { gap: 5px; }
    }
</style>
</head>
<body>

<div class="glow-bg"></div>

<div class="lang-toast" id="langToast">Язык изменён</div>

<div class="calculator">
    <!-- Верхняя панель -->
    <div class="top-bar">
        <div class="mode-switch">
            <button class="mode-btn active" id="basicModeBtn" data-mode="basic" data-i18n="mode.basic">Базовый</button>
            <button class="mode-btn" id="sciModeBtn" data-mode="scientific" data-i18n="mode.scientific">Научный</button>
        </div>

        <button class="lang-switch" id="langSwitch" type="button" onclick="switchLanguage()">
            <span class="lang-flag" id="langFlag">RU</span>
            <span class="lang-code" id="langCode">RU</span>
        </button>
    </div>

    <!-- Дисплей -->
    <div class="display" id="display">
        <div class="mem-indicator" id="memIndicator">M</div>
        <div class="history" id="history"></div>
        <div class="current" id="current">0</div>
    </div>

    <!-- Панели -->
    <div class="panels">
        <!-- БАЗОВАЯ -->
        <div class="panel basic" id="basicPanel">
            <button class="btn clear" data-action="clear" data-i18n="btn.ac">AC</button>
            <button class="btn delete" data-action="delete">DEL</button>
            <button class="btn operator" data-action="percent">%</button>
            <button class="btn operator" data-action="divide">÷</button>

            <button class="btn" data-number="7">7</button>
            <button class="btn" data-number="8">8</button>
            <button class="btn" data-number="9">9</button>
            <button class="btn operator" data-action="multiply">×</button>

            <button class="btn" data-number="4">4</button>
            <button class="btn" data-number="5">5</button>
            <button class="btn" data-number="6">6</button>
            <button class="btn operator" data-action="subtract">−</button>

            <button class="btn" data-number="1">1</button>
            <button class="btn" data-number="2">2</button>
            <button class="btn" data-number="3">3</button>
            <button class="btn operator" data-action="add">+</button>

            <button class="btn" data-number="0">0</button>
            <button class="btn" data-number=".">.</button>
            <button class="btn equal span-2" data-action="equal">=</button>
        </div>

        <!-- НАУЧНАЯ -->
        <div class="panel scientific" id="sciPanel">
            <button class="btn func" data-action="sin">sin</button>
            <button class="btn func" data-action="cos">cos</button>
            <button class="btn func" data-action="tan">tan</button>
            <button class="btn func" data-action="deg">DEG</button>
            <button class="btn clear" data-action="clear" data-i18n="btn.ac">AC</button>

            <button class="btn func" data-action="asin">sin-1</button>
            <button class="btn func" data-action="acos">cos-1</button>
            <button class="btn func" data-action="atan">tan-1</button>
            <button class="btn func" data-action="ln">ln</button>
            <button class="btn delete" data-action="delete">DEL</button>

            <button class="btn func" data-action="square">x²</button>
            <button class="btn func" data-action="cube">x³</button>
            <button class="btn func" data-action="sqrt">√x</button>
            <button class="btn func" data-action="pow">x^y</button>
            <button class="btn func" data-action="factorial">n!</button>

            <button class="btn func" data-action="log">log</button>
            <button class="btn func" data-action="open-paren">(</button>
            <button class="btn func" data-action="close-paren">)</button>
            <button class="btn func" data-action="pi">π</button>
            <button class="btn func" data-action="e">e</button>

            <button class="btn" data-number="7">7</button>
            <button class="btn" data-number="8">8</button>
            <button class="btn" data-number="9">9</button>
            <button class="btn mem" data-action="mem-plus">M+</button>
            <button class="btn mem" data-action="mem-recall" data-i18n="btn.mr">MR</button>

            <button class="btn" data-number="4">4</button>
            <button class="btn" data-number="5">5</button>
            <button class="btn" data-number="6">6</button>
            <button class="btn operator" data-action="divide">÷</button>
            <button class="btn operator" data-action="multiply">×</button>

            <button class="btn" data-number="1">1</button>
            <button class="btn" data-number="2">2</button>
            <button class="btn" data-number="3">3</button>
            <button class="btn operator" data-action="subtract">−</button>
            <button class="btn operator" data-action="add">+</button>

            <button class="btn" data-number="0">0</button>
            <button class="btn" data-number=".">.</button>
            <button class="btn operator" data-action="percent">%</button>
            <button class="btn equal span-2" data-action="equal">=</button>
        </div>
    </div>
</div>

<script>
// ============================================
//   ПЕРЕВОДЫ
// ============================================
var TRANSLATIONS = {
    ru: {
        'mode.basic': 'Базовый',
        'mode.scientific': 'Научный',
        'btn.ac': 'AC',
        'btn.mr': 'MR',
        'toast.changed': 'Язык изменён на русский',
        'title': 'Супер Калькулятор',
        'error': 'Ошибка'
    },
    en: {
        'mode.basic': 'Basic',
        'mode.scientific': 'Scientific',
        'btn.ac': 'AC',
        'btn.mr': 'MR',
        'toast.changed': 'Language changed to English',
        'title': 'Super Calculator',
        'error': 'Error'
    }
};

var LANG_ORDER = ['ru', 'en'];
var LANG_META = {
    ru: { flag: 'RU', code: 'RU' },
    en: { flag: 'EN', code: 'EN' }
};

var currentLang = 'ru';
try {
    var savedLang = localStorage.getItem('calc-lang');
    if (savedLang === 'ru' || savedLang === 'en') {
        currentLang = savedLang;
    }
} catch (e) {
    currentLang = 'ru';
}

// ============================================
//   DOM
// ============================================
var currentEl = document.getElementById('current');
var historyEl = document.getElementById('history');
var displayEl = document.getElementById('display');
var basicPanel = document.getElementById('basicPanel');
var sciPanel = document.getElementById('sciPanel');
var basicModeBtn = document.getElementById('basicModeBtn');
var sciModeBtn = document.getElementById('sciModeBtn');
var memIndicator = document.getElementById('memIndicator');
var langSwitch = document.getElementById('langSwitch');
var langFlag = document.getElementById('langFlag');
var langCode = document.getElementById('langCode');
var langToast = document.getElementById('langToast');

// ============================================
//   СОСТОЯНИЕ
// ============================================
var currentInput = '0';
var previousInput = '';
var operation = null;
var shouldResetScreen = false;
var lastOperation = null;
var lastOperand = null;
var isSolving = false;

var isDegreeMode = true;
var memory = 0;
var hasMemory = false;
var expressionBuffer = '';
var hasOpenParen = false;

// ============================================
//   ЯЗЫК
// ============================================
function getErrorText() {
    return TRANSLATIONS[currentLang]['error'];
}

function isError(val) {
    return val === 'Ошибка' || val === 'Error';
}

function applyTranslations() {
    var dict = TRANSLATIONS[currentLang];

    var els = document.querySelectorAll('[data-i18n]');
    for (var i = 0; i < els.length; i++) {
        var key = els[i].getAttribute('data-i18n');
        if (dict[key] !== undefined) {
            els[i].textContent = dict[key];
        }
    }

    document.title = dict['title'] || document.title;

    if (isError(currentInput)) {
        currentInput = dict['error'];
    }

    updateDisplay();
}

function showLangToast(text) {
    langToast.textContent = text;
    langToast.classList.add('show');
    if (window._toastTimer) clearTimeout(window._toastTimer);
    window._toastTimer = setTimeout(function() {
        langToast.classList.remove('show');
    }, 1800);
}

function switchLanguage() {
    var idx = LANG_ORDER.indexOf(currentLang);
    var nextIdx = (idx + 1) % LANG_ORDER.length;
    currentLang = LANG_ORDER[nextIdx];

    try { localStorage.setItem('calc-lang', currentLang); } catch (e) {}

    langSwitch.classList.remove('switching');
    void langSwitch.offsetWidth;
    langSwitch.classList.add('switching');

    var meta = LANG_META[currentLang];
    langFlag.textContent = meta.flag;
    langCode.textContent = meta.code;

    applyTranslations();
    showLangToast(TRANSLATIONS[currentLang]['toast.changed']);

    setTimeout(function() { langSwitch.classList.remove('switching'); }, 600);
}

window.switchLanguage = switchLanguage;

// ============================================
//   ПЕРЕКЛЮЧЕНИЕ РЕЖИМОВ
// ============================================
function switchMode(mode) {
    var isSci = mode === 'scientific';
    document.body.classList.toggle('scientific', isSci);
    basicModeBtn.classList.toggle('active', !isSci);
    sciModeBtn.classList.toggle('active', isSci);
    clearAll();
}

basicModeBtn.addEventListener('click', function() { switchMode('basic'); });
sciModeBtn.addEventListener('click', function() { switchMode('scientific'); });

// ============================================
//   ИНДИКАТОР ПАМЯТИ
// ============================================
function updateMemIndicator() {
    memIndicator.classList.toggle('active', hasMemory);
}

// ============================================
//   ФОРМАТИРОВАНИЕ
// ============================================
function formatNumber(numStr) {
    if (isError(numStr)) return numStr;
    if (numStr === '') return '0';

    var parts = numStr.split('.');
    var integerPart = parts[0];
    var decimalPart = parts.length > 1 ? parts[1] : null;

    if (integerPart.indexOf('e') === -1 && integerPart.length <= 15) {
        var isNegative = integerPart.charAt(0) === '-';
        if (isNegative) integerPart = integerPart.slice(1);

        var formatted = '';
        for (var i = 0; i < integerPart.length; i++) {
            if (i > 0 && (integerPart.length - i) % 3 === 0) {
                formatted += ' ';
            }
            formatted += integerPart[i];
        }
        integerPart = (isNegative ? '-' : '') + formatted;
    }

    if (decimalPart !== null) return integerPart + '.' + decimalPart;
    return integerPart;
}

function updateDisplay() {
    var displayValue = currentInput;

    if (displayValue.length > 12) {
        currentEl.classList.add('small');
    } else {
        currentEl.classList.remove('small');
    }

    if (isError(displayValue)) {
        currentEl.textContent = getErrorText();
        currentEl.classList.add('small');
    } else if (/^-?\d*\.?\d+(e[+-]?\d+)?$/i.test(displayValue) || displayValue === '0') {
        currentEl.textContent = formatNumber(displayValue);
    } else {
        currentEl.textContent = displayValue;
    }

    if (previousInput && operation) {
        var opSymbol = getOperationSymbol(operation);
        historyEl.textContent = formatNumber(previousInput) + ' ' + opSymbol;
    } else if (lastOperation && lastOperand) {
        var opSymbol2 = getOperationSymbol(lastOperation);
        historyEl.textContent = formatNumber(lastOperand) + ' ' + opSymbol2;
    } else {
        historyEl.textContent = '';
    }

    if (document.body.classList.contains('scientific')) {
        var degBtn = document.querySelector('[data-action="deg"]');
        if (degBtn) degBtn.textContent = isDegreeMode ? 'DEG' : 'RAD';
    }
}

function getOperationSymbol(op) {
    switch (op) {
        case 'add': return '+';
        case 'subtract': return '−';
        case 'multiply': return '×';
        case 'divide': return '÷';
        case 'percent': return '%';
        case 'pow': return '^';
        default: return '';
    }
}

function calculate(a, b, op) {
    var numA = parseFloat(a);
    var numB = parseFloat(b);

    if (isNaN(numA) || isNaN(numB)) return getErrorText();

    var result;
    switch (op) {
        case 'add': result = numA + numB; break;
        case 'subtract': result = numA - numB; break;
        case 'multiply': result = numA * numB; break;
        case 'divide':
            if (numB === 0) return getErrorText();
            result = numA / numB;
            break;
        case 'pow': result = Math.pow(numA, numB); break;
        case 'percent':
            if (b !== undefined && b !== null) {
                result = (numA / 100) * numB;
            } else {
                result = numA / 100;
            }
            break;
        default: return getErrorText();
    }

    if (!isFinite(result) || isNaN(result)) return getErrorText();

    result = Math.round(result * 1e12) / 1e12;
    var resultStr = result.toString();

    if (Math.abs(result) > 1e15 || (Math.abs(result) < 1e-10 && result !== 0)) {
        resultStr = result.toExponential(6);
    }

    return resultStr;
}

function clearAll() {
    currentInput = '0';
    previousInput = '';
    operation = null;
    shouldResetScreen = false;
    lastOperation = null;
    lastOperand = null;
    expressionBuffer = '';
    hasOpenParen = false;
    updateDisplay();
}

// ============================================
//   АНИМАЦИИ
// ============================================
function animateDigitInput() {
    currentEl.classList.remove('digit-pop');
    void currentEl.offsetWidth;
    currentEl.classList.add('digit-pop');
}

function playSolveAnimation(callback) {
    if (isSolving) { if (callback) callback(); return; }
    isSolving = true;

    var equalBtns = document.querySelectorAll('.btn.equal');
    displayEl.classList.remove('flash', 'pulse');
    void displayEl.offsetWidth;
    displayEl.classList.add('flash', 'pulse');

    for (var i = 0; i < equalBtns.length; i++) {
        equalBtns[i].classList.remove('ripple', 'solving');
        void equalBtns[i].offsetWidth;
        equalBtns[i].classList.add('ripple', 'solving');
    }

    document.body.classList.add('solving');
    currentEl.classList.remove('result-appear');
    void currentEl.offsetWidth;

    historyEl.classList.remove('slide-up');
    void historyEl.offsetWidth;
    historyEl.classList.add('slide-up');

    setTimeout(function() {
        if (callback) callback();
        currentEl.classList.add('result-appear');
    }, 150);

    setTimeout(function() {
        displayEl.classList.remove('flash', 'pulse');
        for (var i = 0; i < equalBtns.length; i++) {
            equalBtns[i].classList.remove('ripple', 'solving');
        }
        document.body.classList.remove('solving');
        currentEl.classList.remove('result-appear');
        historyEl.classList.remove('slide-up');
        isSolving = false;
    }, 800);
}

// ============================================
//   ВВОД
// ============================================
function inputNumber(number) {
    if (hasOpenParen) {
        expressionBuffer += number;
        currentInput = expressionBuffer;
        updateDisplay();
        animateDigitInput();
        return;
    }

    if (shouldResetScreen) {
        currentInput = '0';
        shouldResetScreen = false;
    }

    if (number === '.' && currentInput.indexOf('.') !== -1) return;

    if (currentInput === '0' && number !== '.') {
        currentInput = number;
    } else {
        if (currentInput.replace('-', '').replace('.', '').length >= 15) return;
        currentInput += number;
    }

    updateDisplay();
    animateDigitInput();
}

function chooseOperation(op) {
    if (hasOpenParen) {
        expressionBuffer += getOperationSymbol(op);
        currentInput = expressionBuffer;
        updateDisplay();
        return;
    }

    if (operation && !shouldResetScreen && previousInput !== '') {
        var result = calculate(previousInput, currentInput, operation);
        if (isError(result)) {
            currentInput = getErrorText();
            previousInput = '';
            operation = null;
            shouldResetScreen = true;
            updateDisplay();
            return;
        }
        currentInput = result;
        previousInput = result;
    } else {
        previousInput = currentInput;
    }

    operation = op;
    shouldResetScreen = true;
    lastOperation = null;
    lastOperand = null;
    updateDisplay();
}

function computeResult() {
    if (hasOpenParen || expressionBuffer !== '') {
        try {
            var expr = expressionBuffer
                .replace(/×/g, '*')
                .replace(/÷/g, '/')
                .replace(/−/g, '-')
                .replace(/\^/g, '**');

            var result = Function('"use strict"; return (' + expr + ')')();

            if (!isFinite(result) || isNaN(result)) {
                currentInput = getErrorText();
            } else {
                var rounded = Math.round(result * 1e12) / 1e12;
                currentInput = rounded.toString();
            }
        } catch (e) {
            currentInput = getErrorText();
        }

        expressionBuffer = '';
        hasOpenParen = false;
        previousInput = '';
        operation = null;
        shouldResetScreen = true;
        playSolveAnimation(function() { updateDisplay(); });
        return;
    }

    if (!operation && lastOperation && lastOperand) {
        playSolveAnimation(function() {
            var result = calculate(currentInput, lastOperand, lastOperation);
            currentInput = isError(result) ? getErrorText() : result;
            updateDisplay();
        });
        return;
    }

    if (!operation) return;

    playSolveAnimation(function() {
        var result = calculate(previousInput, currentInput, operation);

        if (isError(result)) {
            currentInput = getErrorText();
            previousInput = '';
            operation = null;
            shouldResetScreen = true;
            updateDisplay();
            return;
        }

        lastOperation = operation;
        lastOperand = currentInput;
        currentInput = result;
        previousInput = '';
        operation = null;
        shouldResetScreen = true;
        updateDisplay();
    });
}

function deleteLast() {
    if (hasOpenParen || expressionBuffer !== '') {
        expressionBuffer = expressionBuffer.slice(0, -1);
        var opens = (expressionBuffer.match(/\(/g) || []).length;
        var closes = (expressionBuffer.match(/\)/g) || []).length;
        hasOpenParen = opens > closes;

        currentInput = expressionBuffer === '' ? '0' : expressionBuffer;
        updateDisplay();
        return;
    }

    if (shouldResetScreen) {
        currentInput = '0';
        shouldResetScreen = false;
        updateDisplay();
        return;
    }

    if (isError(currentInput)) { clearAll(); return; }

    if (currentInput.length > 1) {
        currentInput = currentInput.slice(0, -1);
    } else {
        currentInput = '0';
    }

    updateDisplay();
}

function percent() {
    if (isError(currentInput)) return;

    var num = parseFloat(currentInput);
    if (isNaN(num)) return;

    if (previousInput && operation) {
        var base = parseFloat(previousInput);
        if (!isNaN(base)) {
            currentInput = ((base * num) / 100).toString();
        } else {
            currentInput = (num / 100).toString();
        }
    } else {
        currentInput = (num / 100).toString();
    }

    currentInput = parseFloat(currentInput).toString();
    shouldResetScreen = true;
    updateDisplay();
}

// ============================================
//   НАУЧНЫЕ ФУНКЦИИ
// ============================================
function applyUnary(func, label) {
    if (isError(currentInput)) return;

    if (hasOpenParen) {
        expressionBuffer += label + '(';
        currentInput = expressionBuffer;
        updateDisplay();
        return;
    }

    var num = parseFloat(currentInput);
    if (isNaN(num)) return;

    var result;
    try { result = func(num); } catch (e) { result = NaN; }

    if (!isFinite(result) || isNaN(result)) {
        currentInput = getErrorText();
    } else {
        result = Math.round(result * 1e12) / 1e12;
        currentInput = result.toString();
    }

    shouldResetScreen = true;
    playSolveAnimation(function() { updateDisplay(); });
}

function toRadians(angle) {
    return isDegreeMode ? (angle * Math.PI) / 180 : angle;
}

function fromRadians(angle) {
    return isDegreeMode ? (angle * 180) / Math.PI : angle;
}

function factorial(n) {
    if (n < 0 || !Number.isInteger(n)) return NaN;
    if (n === 0 || n === 1) return 1;
    if (n > 170) return Infinity;
    var result = 1;
    for (var i = 2; i <= n; i++) result *= i;
    return result;
}

// ============================================
//   ПАМЯТЬ
// ============================================
function memPlus() {
    var num = parseFloat(currentInput);
    if (isNaN(num)) return;
    memory += num;
    hasMemory = true;
    updateMemIndicator();

    memIndicator.classList.remove('active');
    void memIndicator.offsetWidth;
    memIndicator.classList.add('active');

    shouldResetScreen = true;
}

function memRecall() {
    if (!hasMemory) return;
    currentInput = memory.toString();
    shouldResetScreen = true;
    updateDisplay();
    animateDigitInput();
}

// ============================================
//   СКОБКИ
// ============================================
function openParen() {
    if (expressionBuffer === '') {
        expressionBuffer = currentInput !== '0' ? currentInput : '';
    }
    expressionBuffer += '(';
    currentInput = expressionBuffer;
    hasOpenParen = true;
    updateDisplay();
}

function closeParen() {
    if (!hasOpenParen) return;
    expressionBuffer += ')';
    currentInput = expressionBuffer;

    var opens = (expressionBuffer.match(/\(/g) || []).length;
    var closes = (expressionBuffer.match(/\)/g) || []).length;
    hasOpenParen = opens > closes;

    updateDisplay();
}

// ============================================
//   ОБРАБОТЧИК КНОПОК
// ============================================
document.querySelector('.calculator').addEventListener('click', function(e) {
    var btn = e.target.closest('.btn');
    if (!btn) return;

    if (btn.dataset.number !== undefined) {
        inputNumber(btn.dataset.number);
        return;
    }

    var action = btn.dataset.action;
    if (!action) return;

    switch (action) {
        case 'clear': clearAll(); break;
        case 'delete': deleteLast(); break;
        case 'percent': percent(); break;
        case 'add':
        case 'subtract':
        case 'multiply':
        case 'divide':
            chooseOperation(action);
            break;
        case 'equal': computeResult(); break;

        case 'sin': applyUnary(function(x) { return Math.sin(toRadians(x)); }, 'sin'); break;
        case 'cos': applyUnary(function(x) { return Math.cos(toRadians(x)); }, 'cos'); break;
        case 'tan': applyUnary(function(x) { return Math.tan(toRadians(x)); }, 'tan'); break;
        case 'asin': applyUnary(function(x) { return fromRadians(Math.asin(x)); }, 'asin'); break;
        case 'acos': applyUnary(function(x) { return fromRadians(Math.acos(x)); }, 'acos'); break;
        case 'atan': applyUnary(function(x) { return fromRadians(Math.atan(x)); }, 'atan'); break;

        case 'ln': applyUnary(function(x) { return Math.log(x); }, 'ln'); break;
        case 'log': applyUnary(function(x) { return Math.log10(x); }, 'log'); break;
        case 'sqrt': applyUnary(function(x) { return Math.sqrt(x); }, 'sqrt'); break;

        case 'square': applyUnary(function(x) { return x * x; }, 'sqr'); break;
        case 'cube': applyUnary(function(x) { return x * x * x; }, 'cube'); break;
        case 'pow': chooseOperation('pow'); break;

        case 'factorial': applyUnary(function(x) { return factorial(x); }, 'fact'); break;
        case 'pi':
            currentInput = Math.PI.toString();
            shouldResetScreen = true;
            updateDisplay();
            animateDigitInput();
            break;
        case 'e':
            currentInput = Math.E.toString();
            shouldResetScreen = true;
            updateDisplay();
            animateDigitInput();
            break;

        case 'open-paren': openParen(); break;
        case 'close-paren': closeParen(); break;

        case 'mem-plus': memPlus(); break;
        case 'mem-recall': memRecall(); break;

        case 'deg':
            isDegreeMode = !isDegreeMode;
            updateDisplay();
            break;

        default: break;
    }
});

// ============================================
//   КЛАВИАТУРА
// ============================================
document.addEventListener('keydown', function(e) {
    var key = e.key;

    if (/[0-9.]/.test(key)) {
        e.preventDefault();
        inputNumber(key);
        return;
    }

    switch (key) {
        case '+': e.preventDefault(); chooseOperation('add'); break;
        case '-': e.preventDefault(); chooseOperation('subtract'); break;
        case '*': case 'x': case 'X':
            e.preventDefault(); chooseOperation('multiply'); break;
        case '/': e.preventDefault(); chooseOperation('divide'); break;
        case '^': e.preventDefault(); chooseOperation('pow'); break;
        case '%': e.preventDefault(); percent(); break;
        case '(': e.preventDefault(); openParen(); break;
        case ')': e.preventDefault(); closeParen(); break;
        case 'Enter': case '=':
            e.preventDefault(); computeResult(); break;
        case 'Backspace': e.preventDefault(); deleteLast(); break;
        case 'Escape': case 'c': case 'C':
            e.preventDefault(); clearAll(); break;
        default: break;
    }
});

// ============================================
//   ИНИЦИАЛИЗАЦИЯ
// ============================================
(function initLanguage() {
    var meta = LANG_META[currentLang];
    langFlag.textContent = meta.flag;
    langCode.textContent = meta.code;
    applyTranslations();
})();

updateDisplay();
updateMemIndicator();

window.addEventListener('load', function() {
    var calc = document.querySelector('.calculator');
    calc.style.opacity = '0';
    calc.style.transform = 'translateY(20px)';
    setTimeout(function() {
        calc.style.transition = 'opacity 0.6s ease, transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1)';
        calc.style.opacity = '1';
        calc.style.transform = 'translateY(0)';
    }, 100);
});
</script>
</body>
</html>
